name: Build QNX ARMv7 Toolchain

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            texinfo \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            wget \
            curl \
            git \
            python3 \
            zlib1g-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4' # Matches your branch naming

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu # Adjust target if the rust build requires it

      - name: Build Toolchain
        run: |
          pwd
          echo "$GITHUB_WORKSPACE"
          ls -la
          ls -la host-scripts
          test -f host-scripts/qnx-run.sh
          if [ -f "host-scripts/qnx-run.sh" ]; then
            host-scripts/qnx-run.sh build
            host-scripts/qnx-run.sh build 4.9
          else
            echo "No build script found. Please update the workflow with the correct build command."
            exit 1
          fi

      - name: Save built image
        run: |
          docker image inspect qnx65-armv7-toolchain:8.5-full
          docker save qnx65-armv7-toolchain:8.5-full | gzip -9 > qnx65-armv7-toolchain-8.5-full.tar.gz
          docker image inspect qnx65-armv7-toolchain:4.9
          docker save qnx65-armv7-toolchain:4.9 | gzip -9 > qnx65-armv7-toolchain-4.9.tar.gz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: qnx65-armv7-toolchain-images
          path: |
            qnx65-armv7-toolchain-8.5-full.tar.gz
            qnx65-armv7-toolchain-4.9.tar.gz
          retention-days: 90
          compression-level: 0
